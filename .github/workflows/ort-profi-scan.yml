name: ORT & ScanCode Profi-Scan

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'GitHub-Link zum fremden Projekt (z. B. https://github.com)'
        required: true
        type: string

jobs:
  ort-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: HTTPS für Git-Downloads aktivieren
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: ORT Full-Stack (Analyzer, ScanCode, Advisor, Evaluator & Report)
        uses: oss-review-toolkit/ort-ci-github-action@main
        with:
          vcs-url: '${{ github.event.inputs.repo_url }}'
          allow-dynamic-versions: 'true'
          ort-config-repository: 'https://github.com/oss-review-toolkit/ort-config'
          run: 'analyzer,scanner,advisor,evaluator,reporter,upload-results'

name: Universeller Profi-Scanner (ORT + ScanCode + OSV)

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Vollständiger GitHub-Link (z. B. https://github.com)'
        required: true
        type: string

jobs:
  universal-scan:
    runs-on: ubuntu-latest
    # Maximale Laufzeit für große Repos mit vielen C/C++-Dateien
    timeout-minutes: 360

    steps:
      - name: Link bereinigen
        id: clean
        run: |
          CLEAN_URL=$(echo "${{ github.event.inputs.repo_url }}" | xargs)
          echo "url=$CLEAN_URL" >> $GITHUB_OUTPUT

      - name: Universelle Vollanalyse (Struktur, Abhängigkeiten, Lizenzen & Security)
        uses: oss-review-toolkit/ort-ci-github-action@main
        with:
          vcs-url: '${{ steps.clean.outputs.url }}'
          # Erlaubt Analyse auch ohne Lockfiles (für beliebige Repos)
          allow-dynamic-versions: 'true'
          # Offizielles Regelwerk für Lizenz- & Policy-Prüfung
          ort-config-repository: 'https://github.com'
          # Komplett-Pipeline mit Caching für schnelle Wiederholungs-Scans
          run: 'cache-dependencies,cache-scan-results,analyzer,scanner,advisor,evaluator,reporter,upload-results'
          # ScanCode durchsucht die komplette Ordnerstruktur & alle Pakete
          ort-cli-scan-args: '--scanners=ScanCode'
          # OSV prüft alle direkten & indirekten Abhängigkeiten auf Sicherheitslücken
          ort-cli-advisor-args: '--advisors=OSV'
          # Erzeugt die interaktive Auswertung + standardisierte SBOM
          report-formats: 'WebApp,CycloneDx'
          # Stellt sicher, dass der Report am Ende IMMER erstellt und hochgeladen wird
          fail-on: 'none'

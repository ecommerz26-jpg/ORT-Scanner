name: ORT & ScanCode Profi-Scan

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Vollständiger GitHub-Link (z. B. https://github.com)'
        required: true
        type: string

jobs:
  ort-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Link bereinigen
        id: clean
        run: |
          CLEAN_URL=$(echo "${{ github.event.inputs.repo_url }}" | xargs)
          echo "url=$CLEAN_URL" >> $GITHUB_OUTPUT

      - name: ORT Full-Stack Analyse (Analyzer, ScanCode, OSV Advisor & Evaluator)
        uses: oss-review-toolkit/ort-ci-github-action@main
        with:
          vcs-url: '${{ steps.clean.outputs.url }}'
          allow-dynamic-versions: 'true'
          # Offizielles ORT-Regelwerk für den Evaluator
          ort-config-repository: 'https://github.com'
          # Komplette Pipeline inklusive Caching
          run: 'cache-dependencies,cache-scan-results,analyzer,scanner,advisor,evaluator,reporter,upload-results'
          # ScanCode als Scanner + OSV für Sicherheitslücken festlegen
          ort-cli-scan-args: '--scanners=ScanCode'
          ort-cli-advisor-args: '--advisors=OSV'
          # Ergebnisse als interaktive HTML-WebApp und SBOM ausgeben
          report-formats: 'WebApp,CycloneDx'
          # Bricht den Workflow erst bei echten Fehlern ab, nicht bei bloßen Warnungen
          fail-on: 'severe-rule-violation,severe-issue'

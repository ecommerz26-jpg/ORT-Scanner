name: Universeller Profi-Scanner (ORT + ScanCode + OSV)

on:
  workflow_dispatch:
    inputs:
      repo_url:
        description: 'Vollständiger GitHub-Link (z. B. https://github.com)'
        required: true
        type: string

jobs:
  ort-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Repo-Name aus Link extrahieren
        id: parse
        run: |
          CLEAN_REPO=$(echo "${{ github.event.inputs.repo_url }}" | sed -E 's|https?://github.com/||; s|\.git$||; s|/$||' | xargs)
          echo "repo=$CLEAN_REPO" >> $GITHUB_OUTPUT

      - name: HTTPS statt SSH für Git erzwingen
        run: git config --global url.https://github.com/.insteadOf ssh://git@github.com/

      - name: Ziel-Repository herunterladen
        uses: actions/checkout@v5
        with:
          repository: '${{ steps.parse.outputs.repo }}'

      - name: ORT Vollanalyse (Analyzer, ScanCode, OSV & WebApp)
        uses: oss-review-toolkit/ort-ci-github-action@main
        with:
          allow-dynamic-versions: 'true'
          run: 'cache-dependencies,cache-scan-results,analyzer,scanner,advisor,evaluator,reporter,upload-results'
          ort-cli-scan-args: '--scanners=ScanCode'
          advisors: 'OSV'
          report-formats: 'WebApp,CycloneDx'
          fail-on: 'none'
